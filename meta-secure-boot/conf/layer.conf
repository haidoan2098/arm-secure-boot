# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-secure-boot"
BBFILE_PATTERN_meta-secure-boot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-secure-boot = "6"

LAYERDEPENDS_meta-secure-boot = "core"
LAYERSERIES_COMPAT_meta-secure-boot = "scarthgap"
